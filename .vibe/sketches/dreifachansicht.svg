<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" role="img" aria-labelledby="t d">
  <title id="t">Skizze: Komponente Dreifachansicht</title>
  <desc id="d">Oben der Term y gleich k mal x. Darunter ein Regler für k. Dann die Wertetabelle mit x von 0 bis 5 und die Pfeile mal k. Darunter der Graph mit der Geraden durch den Ursprung. Ganz unten ein Satz, der alles in Worten beschreibt.</desc>
  <rect x="5" y="5" width="350" height="410" fill="none" stroke="#444"/>
  <text x="20" y="35" font-size="18" font-family="serif" font-style="italic">y = 2 · x</text>
  <text x="20" y="62" font-size="13" font-family="sans-serif">Regler k: 0 ──●────── 5   (Pfeiltasten)</text>
  <rect x="20" y="75" width="320" height="70" fill="none" stroke="#444"/>
  <text x="30" y="98" font-size="13" font-family="sans-serif">x   0  1  2  3  4  5</text>
  <text x="30" y="125" font-size="13" font-family="sans-serif">y   0  2  4  6  8 10   (Pfeile · 2)</text>
  <rect x="20" y="155" width="320" height="200" fill="none" stroke="#444"/>
  <line x1="60" y1="335" x2="60" y2="165" stroke="#444"/><line x1="40" y1="320" x2="330" y2="320" stroke="#444"/>
  <line x1="60" y1="320" x2="260" y2="190" stroke="#444" stroke-width="3"/>
  <text x="20" y="380" font-size="12" font-family="sans-serif">Satz: Die Gerade steigt, geht durch den Ursprung.</text>
  <text x="20" y="400" font-size="12" font-family="sans-serif">Pro 1 nach rechts 2 nach oben.</text>
</svg>
