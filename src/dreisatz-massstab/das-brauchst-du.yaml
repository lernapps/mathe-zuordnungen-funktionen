# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: "Drei Dinge aus früheren Klassen, die du für Dreisatz und Maßstab brauchst: Rechenregeln, Größen und Umrechnen."
recap:
  [mathematik/grundrechenarten-rechengesetze, mathematik/messen-laenge-masse-geld-zeit, mathematik/umrechnung-groessen]
blocks:
  - type: section
    id: einstieg
    title: Das brauchst du für dieses Kapitel
    blocks:
      - type: text
        text: |
          Mia, Ben, Elif und Jonas (alle 12 Jahre alt) planen mit ihrer Klasse eine Klassenfahrt in eine Jugendherberge. Jonas kauft Postkarten, Elif liest einen Stadtplan. Wenn du dabei mitrechnen willst, musst du drei Dinge sicher können. Zwei Übungen zeigen dir am Ende, ob es klappt.
  - type: section
    id: rechengesetze
    title: Vorrangregeln und Rechengesetze
    blocks:
      - type: text
        text: |
          Wenn eine Rechnung mehrere Rechenzeichen hat, brauchst du eine feste Reihenfolge, sonst kommt jeder auf ein anderes Ergebnis. Ich kann Klammern und Vorrangregeln beachten und Rechengesetze für vorteilhaftes Rechnen nutzen.
      - type: definition
        term: Vorrangregel
        explanation: "Punkt vor Strich: Mal und geteilt rechnest du vor plus und minus. Beispiel: $3 + 4 \\cdot 2 = 3 + 8 = 11$."
      - type: definition
        term: Klammer
        explanation: "Was in der Klammer steht, rechnest du zuerst. Beispiel: $(3 + 4) \\cdot 2 = 7 \\cdot 2 = 14$."
  - type: section
    id: groessen
    title: Länge, Masse, Geld und Zeit
    blocks:
      - type: text
        text: |
          Wenn du wissen willst, wie lang, wie schwer oder wie teuer etwas ist, brauchst du Größen mit Einheiten. Ich kann Länge, Masse, Geld und Zeit messen und damit in Sachaufgaben rechnen.
      - type: definition
        term: Einheit
        explanation: "Die Einheit sagt, womit gemessen wird: cm für Länge, kg für Masse, € für Geld, min für Zeit. Beispiel: 3 cm, 2 kg, 5 €."
  - type: section
    id: umrechnen
    title: Einheiten umrechnen
    blocks:
      - type: text
        text: |
          Wenn eine Aufgabe zwei verschiedene Einheiten mischt, zum Beispiel Meter und Kilometer, rechnest du erst um und dann weiter. Ich kann Größen in andere Einheiten umrechnen und passende Einheiten wählen.
      - type: definition
        term: Umrechnungszahl
        explanation: "Die Umrechnungszahl sagt, wie viele kleine Einheiten in einer größeren stecken: 1 m = 100 cm, 1 km = 1000 m, 1 kg = 1000 g. Beispiel: 3 m = 3 · 100 cm = 300 cm."
  - type: section
    id: selbsttest
    title: Kannst du das?
    blocks:
      - type: number
        id: test-vorrang
        text: "Was ergibt 18 + 6 · 7 − 4 · 5?"
        answer: 40
        tolerance: 0
        mistakes:
          - answer: 820
            message: "Du hast von links nach rechts gerechnet. Mal geht vor plus und minus: Rechne erst die Malaufgaben aus."
          - answer: 60
            message: "Du hast die Aufgabe − 4 · 5 vergessen."
          - answer: 148
            message: "Du hast 18 + 6 zuerst gerechnet. Punkt vor Strich: Rechne erst 6 · 7 und 4 · 5."
          - answer: 164
            message: "Du hast nur bis − 4 von links nach rechts gerechnet und · 5 vergessen. Mal geht vor minus."
        explanation: "Erst 6 · 7 = 42 und 4 · 5 = 20, dann 18 + 42 − 20 = 40 (Punkt vor Strich)."
      - type: number
        id: test-einheiten
        text: "Ein Weg ist 2,5 km lang. Jonas ist schon 800 m gegangen. Wie viele Meter muss er noch gehen?"
        answer: 1700
        tolerance: 0
        unit: m
        mistakes:
          - answer: 1.7
            message: "Das wären 1,7 km. Gefragt sind Meter: 1 km hat 1000 m."
          - answer: 3300
            message: "Du hast addiert. Jonas ist schon 800 m gegangen, diese Strecke geht von der ganzen Länge ab."
          - answer: -550
            message: "Du hast 2,5 − 800 gerechnet. Rechne beide Längen in dieselbe Einheit um, hier Meter."
        explanation: "2,5 km sind 2500 m. Dann 2500 m − 800 m = 1700 m."
      - type: text
        text: |
          Wenn das nicht klappt, wiederhole die Bausteine auf der Lernlandkarte: [Vorrangregeln und Rechengesetze](https://lernapps.net/apps/map/mathematik/c/grundrechenarten-rechengesetze/), [Länge, Masse, Geld und Zeit](https://lernapps.net/apps/map/mathematik/c/messen-laenge-masse-geld-zeit/) und [Einheiten umrechnen](https://lernapps.net/apps/map/mathematik/c/umrechnung-groessen/).
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - Punkt vor Strich richtig anwendest,
          - Längen in verschiedenen Einheiten (km und m) in einer Sachaufgabe verbindest.
