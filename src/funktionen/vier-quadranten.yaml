# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das Koordinatensystem mit negativen Zahlen
description: "Du erweiterst das Koordinatensystem auf negative Zahlen, nennst die vier Quadranten und liest Punkte mit negativen Koordinaten ab."
competencies: [funktionen-darstellung]
blocks:
  - type: section
    id: einstieg
    title: Temperatur vor und nach Mittag
    blocks:
      - type: text
        text: |
          Die Klasse misst die Temperatur. Die Zeit x zählt in Stunden von 12 Uhr aus: −2 heißt 10 Uhr, 3 heißt 15 Uhr. Die
          Temperatur y fällt, und sie wird auch negativ. Darum brauchen die Achsen **negative Zahlen**.
      - type: vue-component
        id: temperatur-graph
        component: Dreifachansicht
        props:
          kind: linear
          xLabel: Zeit ab 12 Uhr (h)
          yLabel: Temperatur (°C)
          xUnit: h
          yUnit: °C
          xs: [-2, -1, 0, 1, 2, 3]
          xMin: -3
          xMax: 5
          yMin: -4
          yMax: 6
          tickX: 1
          tickY: 1
          a: -1
          aMin: -1
          aMax: -1
          aStep: 1
          aName: m
          b: 2
          fixed: true
          hideTerm: true
        nojs: |
          Tabelle zur Temperatur: um 10 Uhr (x = −2) 4 °C, um 11 Uhr 3 °C, um 12 Uhr 2 °C, um 13 Uhr 1 °C, um 14 Uhr 0 °C, um 15 Uhr
          −1 °C. Der Graph ist eine fallende Linie. Sie liegt links oben und rechts unten.
  - type: section
    id: erklaerung
    title: Vier Quadranten
    blocks:
      - type: figure
        image: images/vier-quadranten.svg
        alt: "Koordinatensystem mit Zahlen von −3 bis 3 auf beiden Achsen. Oben rechts steht I, oben links II, unten links III, unten rechts IV."
        caption: "Die Achsen teilen die Ebene in vier Quadranten. Gezählt wird gegen den Uhrzeigersinn, rechts oben beginnend."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Die Achsen sind **Zahlengeraden**: rechts und oben stehen positive Zahlen, links und unten negative. Die Achsen schneiden sich
          im Ursprung (0|0). Erst kommt der x-Wert, dann der y-Wert.
      - type: table
        caption: Vorzeichen in den Quadranten
        header: ["Quadrant", "x", "y"]
        rowHeaders: true
        rows:
          - ["I (rechts oben)", "positiv", "positiv"]
          - ["II (links oben)", "negativ", "positiv"]
          - ["III (links unten)", "negativ", "negativ"]
          - ["IV (rechts unten)", "positiv", "negativ"]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Ein Minus vor dem x-Wert heißt: nach links. Ein Minus vor dem y-Wert heißt: nach unten. In einer Rechnung setzt du negative
              Zahlen in Klammern: 5 + (−3) = 2.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Vier Punkte, vier Quadranten
        blocks:
          - type: table
            caption: Punkte und ihre Quadranten
            header: ["Punkt", "Weg", "Quadrant"]
            rows:
              - ["A (2|3)", "2 nach rechts, 3 nach oben", "I"]
              - ["B (−3|1)", "3 nach links, 1 nach oben", "II"]
              - ["C (−2|−2)", "2 nach links, 2 nach unten", "III"]
              - ["D (3|−1)", "3 nach rechts, 1 nach unten", "IV"]
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: quadrant-um-sechzehn
        text: "Um 16 Uhr (x = 4) sind es −2 °C. In welchem Quadranten liegt der Punkt (4|−2)?"
        options:
          - text: "Quadrant I"
            correct: false
            info: "Im Quadranten I sind beide Werte positiv. Hier ist y negativ."
          - text: "Quadrant III"
            correct: false
            info: "Im Quadranten III sind beide Werte negativ. Hier ist x = 4 positiv."
          - text: "Quadrant IV"
            correct: true
            info: "x ist positiv (nach rechts), y negativ (nach unten): rechts unten, Quadrant IV."
        explanation: "Positives x, negatives y gehört zum Quadranten IV."
        links:
          - title: "Lernlandkarte: Darstellungen von Funktionen"
            url: https://lernapps.net/apps/map/mathematik/c/funktionen-darstellung/
      - type: matching
        id: punkte-quadranten
        text: "Ordne jedem Punkt seinen Quadranten zu."
        pairs:
          - left: "(3|2)"
            right: "Quadrant I"
          - left: "(−2|4)"
            right: "Quadrant II"
          - left: "(−5|−1)"
            right: "Quadrant III"
          - left: "(1|−6)"
            right: "Quadrant IV"
        explanation: "Achte auf die Vorzeichen. Erster Wert x: negativ heißt links. Zweiter Wert y: negativ heißt unten."
        links:
          - title: "Lernlandkarte: Darstellungen von Funktionen"
            url: https://lernapps.net/apps/map/mathematik/c/funktionen-darstellung/
      - type: number
        id: abstand-y-achse
        text: "Wie viele Einheiten liegt der Punkt (−3|2) von der y-Achse entfernt?"
        answer: 3
        tolerance: 0
        mistakes:
          - answer: 2
            message: "2 ist der y-Wert, also die Höhe über der x-Achse. Der Abstand zur y-Achse ist der x-Wert ohne Minus."
          - answer: -3
            message: "Ein Abstand ist nie negativ. Das Minus sagt nur, dass der Punkt links liegt."
        explanation: "Der Abstand zur y-Achse ist der Betrag des x-Werts: 3 Einheiten, nach links."
        links:
          - title: "Lernlandkarte: Darstellungen von Funktionen"
            url: https://lernapps.net/apps/map/mathematik/c/funktionen-darstellung/
      - type: number
        id: klammer-rechnung
        text: "Rechne: 5 + (−3)"
        answer: 2
        tolerance: 0
        mistakes:
          - answer: 8
            message: "Du hast 5 + 3 gerechnet. (−3) heißt: 3 wird abgezogen."
        explanation: "Plus eine negative Zahl ist wie minus: 5 − 3 = 2."
        links:
          - title: "Lernlandkarte: Darstellungen von Funktionen"
            url: https://lernapps.net/apps/map/mathematik/c/funktionen-darstellung/
      - type: true-false
        id: vorzeichen-quadrant
        text: "Ein Punkt mit negativem x-Wert und negativem y-Wert liegt links unten, im Quadranten III."
        answer: true
        explanation: "Negatives x: links. Negatives y: unten. Das ist links unten, Quadrant III."
        links:
          - title: "Lernlandkarte: Darstellungen von Funktionen"
            url: https://lernapps.net/apps/map/mathematik/c/funktionen-darstellung/
      - type: text
        text: |
          **Das kannst du jetzt:** Du liest Punkte in allen vier Quadranten und kennst die Vorzeichen der Koordinaten. Als Nächstes
          wechselst du zwischen Situation, Tabelle und Graph.
