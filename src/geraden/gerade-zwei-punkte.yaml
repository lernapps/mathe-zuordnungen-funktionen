# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Gerade durch zwei Punkte
description: "Du stellst die Gleichung einer Geraden aus zwei Punkten auf: erst m mit dem Steigungsdreieck, dann b durch Einsetzen."
competencies: [geradengleichungen]
blocks:
  - type: section
    id: einstieg
    title: Zwei Fahrten, ein Tarif
    blocks:
      - type: text
        text: |
          Zwei Taxifahrten sind bekannt: 2 km kosten 7 € (Punkt A) und 5 km kosten 13 € (Punkt B). Wie lautet die Gleichung des Tarifs? Nach
          dieser Seite stellst du sie aus **zwei Punkten** auf. Stelle zuerst mit den Reglern $m$ und $b$ die Gerade so ein, dass sie durch beide Kreuze A und B geht. Dann passen $m$ und $b$.
      - type: vue-component
        id: ab-regler
        component: Dreifachansicht
        props:
          kind: linear
          xLabel: Strecke (km)
          yLabel: Preis (€)
          xUnit: km
          yUnit: €
          xs: [0, 2, 4]
          xMin: 0
          xMax: 6
          yMin: 0
          yMax: 16
          tickX: 1
          tickY: 2
          a: 1
          aMin: 0
          aMax: 4
          aStep: 0.5
          aName: m
          b: 0
          bMin: 0
          bMax: 6
          bStep: 1
          bName: b
          marks:
            - { x: 2, y: 7, name: A }
            - { x: 5, y: 13, name: B }
        nojs: |
          Die Punkte A (2|7) und B (5|13) sind markiert. Mit den Reglern $m$ und $b$ wird die Gerade $y$ = $m$ · $x$ + $b$ so verschoben und gedreht, dass sie
          durch beide Punkte geht. Zu Beginn ist $m$ = 1 und $b$ = 0: Für $x$ = 0, 2, 4 ist $y$ = 0, 2, 4. Die Tabelle ändert sich mit den Reglern.
  - type: section
    id: erklaerung
    title: Erst m, dann b
    blocks:
      - type: text
        text: "Wenn du einen Tarif aus zwei bekannten Preisen herausfinden willst, hast du zwei Punkte. Daraus bestimmst du die Gleichung in zwei Schritten."
      - type: definition
        term: Geradengleichung
        explanation: "Die Geradengleichung $y$ = $m$ · $x$ + $b$ beschreibt alle Punkte einer Geraden. Beispiel: $y$ = 2 · $x$ + 3 geht durch (0|3) und (1|5)."
      - type: text
        text: |
          **Schritt 1, die Steigung:** $m$ = ($y_2$ − $y_1$) : ($x_2$ − $x_1$), das ist das Steigungsdreieck von A nach B. **Schritt 2, der Achsenabschnitt:**
          Setze einen der Punkte und $m$ in $y$ = $m$ · $x$ + $b$ ein und löse nach $b$ auf.
      - type: formula
        formula: 'm = \frac{y_2 - y_1}{x_2 - x_1} \qquad b = y_1 - m \cdot x_1'
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Zuerst $m$, dann $b$. Zum Schluss die **Probe** mit dem anderen Punkt: Setze B ein. Stimmt es, ist die Gleichung richtig.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: A (2|7) und B (5|13)
        blocks:
          - type: text
            text: "Steigung: $m = (13 - 7) : (5 - 2) = 6 : 3 = 2$. Achsenabschnitt: Setze A ein, $7 = 2 \\cdot 2 + b$, also $b = 3$. Gleichung: $y = 2 \\cdot x + 3$. Probe mit B: $2 \\cdot 5 + 3 = 13$ stimmt."
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: m-aus-zwei-punkten
        given:
          e: { pick: 1, from: { data: gerade-zwei-punkte } }
        task:
          text: "Eine Gerade geht durch A ({{e.x1}}|{{e.y1}}) und B ({{e.x2}}|{{e.y2}}). Wie groß ist die Steigung $m$?"
        answer: { value: "e.m", compare: { number: { format: integer } } }
        mistakes:
          - value: "e.y2 - e.y1"
            message: "Das ist nur Δy. Teile noch durch Δx = {{e.x2}} − {{e.x1}}."
        hint: "m = (y₂ − y₁) : (x₂ − x₁)."
        steps:
          - "$\\Delta y$ = {{e.y2}} − {{e.y1}}, $\\Delta x$ = {{e.x2}} − {{e.x1}}."
          - "$m$ = $\\Delta y$ : $\\Delta x$."
      - type: generated
        id: b-aus-zwei-punkten
        given:
          e: { pick: 1, from: { data: gerade-zwei-punkte } }
        task:
          text: "Eine Gerade geht durch A ({{e.x1}}|{{e.y1}}) und B ({{e.x2}}|{{e.y2}}). Wie groß ist der $y$-Achsenabschnitt $b$?"
        answer: { value: "e.b", compare: { number: { format: integer } } }
        mistakes:
          - value: "e.y1"
            message: "{{e.y1}} ist der y-Wert von A, nicht der y-Achsenabschnitt. b ist der y-Wert bei x = 0."
          - value: "e.y1 - e.m"
            message: "Du hast nur m abgezogen. Setze A ein: y₁ = m · x₁ + b, also b = y₁ − m · x₁. Dabei x₁ = {{e.x1}} nicht vergessen."
        hint: "Berechne zuerst m. Dann b = y₁ − m · x₁."
        steps:
          - "Erst $m$ aus beiden Punkten."
          - "$b$ = {{e.y1}} − $m$ · {{e.x1}}."
      - type: number
        id: preis-zehn-km
        text: "Der Tarif ist $y$ = 2 · $x$ + 3 ($x$ in km, $y$ in €). Was kostet eine Fahrt von 10 km?"
        answer: 23
        tolerance: 0
        unit: €
        mistakes:
          - answer: 20
            message: "Du hast den Grundpreis b = 3 vergessen."
          - answer: 50
            message: "Du hast (2 + 3) · 10 gerechnet. Mal geht vor plus: erst 2 · 10, dann + 3."
        explanation: "$y = 2 \\cdot 10 + 3 = 23$."
      - type: single-choice
        id: welche-gleichung-ab
        text: "Welche Gleichung gehört zur Geraden durch A (1|4) und B (3|10)?"
        options:
          - text: "y = 3 · x + 1"
            correct: true
            info: "$m$ = (10 − 4) : (3 − 1) = 3, und $b$ = 4 − 3 · 1 = 1. Probe mit B: 3 · 3 + 1 = 10."
          - text: "y = 3 · x + 4"
            correct: false
            info: "Das $b$ ist falsch: 4 ist der $y$-Wert von A, nicht $b$. Probe mit A: 3 · 1 + 4 = 7, nicht 4."
          - text: "y = 6 · x − 2"
            correct: false
            info: "6 ist $\\Delta y$, nicht die Steigung. Teile durch $\\Delta x$ = 2: $m$ = 3."
        explanation: "Erst $m$ aus dem Steigungsdreieck, dann $b$ durch Einsetzen eines Punktes."
      - type: text
        text: |
          **Das kannst du jetzt:** Du stellst aus zwei Punkten die Gleichung $y$ = $m$ · $x$ + $b$ auf und prüfst sie. Als Nächstes ist nur ein Punkt
          und die Steigung gegeben.
