# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das Einsetzungsverfahren
description: "Du löst ein Gleichungssystem rechnerisch, indem du einen Term für y in die andere Gleichung einsetzt."
competencies: [lgs-rechnerisch]
blocks:
  - type: section
    id: einstieg
    title: Eine Gleichung ist schon nach y aufgelöst
    blocks:
      - type: text
        text: |
          **I:** $y$ = 2 · $x$ + 1. **II:** 3 · $x$ + $y$ = 11. In I steht $y$ allein, in II steht $y$ neben 3 · $x$. Du darfst in II für $y$ den Term aus I einsetzen,
          weil beide für dieselbe Zahl stehen. Wie sieht II dann aus?
  - type: section
    id: erklaerung
    title: Einsetzen in drei Schritten
    blocks:
      - type: definition
        term: Einsetzungsverfahren
        explanation: "Beim Einsetzungsverfahren ersetzt du in einer Gleichung ein $y$ durch den Term der anderen. Es bleibt eine Gleichung mit nur $x$. Beispiel: 3 · $x$ + (2 · $x$ + 1) = 11."
      - type: text
        text: |
          **Schritt 1:** Den Term für $y$ in die andere Gleichung einsetzen, **mit Klammer**. **Schritt 2:** Nach $x$ lösen. **Schritt 3:** $x$ in die
          erste Gleichung einsetzen und $y$ berechnen. Dann die Probe in beiden.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Setze den Term immer in **Klammern** ein. Bei 3 · $x$ + (2 · $x$ + 1) steht alles in der Klammer, was für $y$ steht, auch das Plus. Ohne Klammer kommt es zu
              Vorzeichenfehlern, vor allem bei einem Minus.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: "I: y = 2 · x + 1, II: 3 · x + y = 11"
        blocks:
          - type: table
            caption: Rechenweg zeilenweise
            header: ["Schritt", "Rechnung", "Begründung"]
            rows:
              - ["1", "3 · $x$ + (2 · $x$ + 1) = 11", "$y$ durch 2 · $x$ + 1 ersetzen"]
              - ["2", "5 · $x$ + 1 = 11", "3 · $x$ und 2 · $x$ zusammenfassen"]
              - ["3", "5 · $x$ = 10", "1 auf beiden Seiten abziehen"]
              - ["4", "$x$ = 2", "durch 5 teilen"]
              - ["5", "$y$ = 2 · 2 + 1 = 5", "$x$ in I einsetzen"]
          - type: text
            text: "Probe in II: $3 \\cdot 2 + 5 = 11$. Die Lösung ist (2|5)."
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: einsetzen-x
        given:
          e: { pick: 1, from: { data: lgs-einsetzen } }
        task:
          text: "Löse mit dem Einsetzungsverfahren: I: $y$ = {{e.m}} · $x$ + {{e.b}} und II: {{e.p}} · $x$ + $y$ = {{e.d}}. Wie groß ist $x$?"
        answer: { value: "e.x", compare: { number: { format: integer } } }
        mistakes:
          - value: "e.t"
            message: "Du hast die Gleichung nicht ganz gelöst. {{e.s}} · x = {{e.t}}, jetzt noch durch {{e.s}} teilen."
          - value: "e.y"
            message: "Das ist y. Gefragt ist x. Löse die Gleichung, die nach dem Einsetzen entsteht."
        hint: "Setze {{e.m}} · x + {{e.b}} für y in II ein, mit Klammer."
        steps:
          - "{{e.p}} · $x$ + ({{e.m}} · $x$ + {{e.b}}) = {{e.d}}"
          - "{{e.s}} · $x$ + {{e.b}} = {{e.d}}, also {{e.s}} · $x$ = {{e.t}}"
          - "$x$ = {{e.t}} : {{e.s}} = {{answer}}."
      - type: generated
        id: einsetzen-y
        given:
          e: { pick: 1, from: { data: lgs-einsetzen } }
        task:
          text: "Das System I: $y$ = {{e.m}} · $x$ + {{e.b}} und II: {{e.p}} · $x$ + $y$ = {{e.d}} hat bei $x$ = {{e.x}} seine Lösung. Berechne $y$."
        answer: { value: "e.y", compare: { number: { format: integer } } }
        mistakes:
          - value: "e.d + e.p * e.x"
            message: "Du hast {{e.p}} · x addiert. Die Probe in II zeigt es: y = {{e.d}} − {{e.p}} · {{e.x}}. Am einfachsten setzt du x in Gleichung I ein."
        hint: "Setze x in Gleichung I ein: y = {{e.m}} · x + {{e.b}}."
        steps:
          - "$y$ = {{e.m}} · {{e.x}} + {{e.b}} = {{answer}}."
          - "Probe in II: {{e.p}} · {{e.x}} + {{answer}} = {{e.d}}."
      - type: number
        id: einsetzen-mit-klammer
        text: "Setze $y$ = $x$ + 2 in die Gleichung 4 · $x$ − $y$ = 7 ein. Welche Zahl ist $x$?"
        answer: 3
        tolerance: 0
        mistakes:
          - answer: 5
            message: "5 ist y, nicht x. Gefragt ist x: Löse 4 · x − (x + 2) = 7, also 3 · x − 2 = 7."
        explanation: "$4 \\cdot x - (x + 2) = 7$, also $3 \\cdot x - 2 = 7$, $3 \\cdot x = 9$, $x = 3$. Dann $y = 5$."
        links:
          - title: "Lernlandkarte: Lineare Gleichungssysteme: rechnerisch"
            url: https://lernapps.net/apps/map/mathematik/c/lgs-rechnerisch/
      - type: single-choice
        id: einsetzen-klammer-wahl
        text: "I: $y$ = 2 · $x$ − 3, II: 5 · $x$ − $y$ = 6. Wie sieht II nach dem Einsetzen aus?"
        options:
          - text: "5 · x − (2 · x − 3) = 6"
            correct: true
            info: "$y$ wird als Ganzes durch 2 · $x$ − 3 ersetzt, deshalb steht es in Klammern."
          - text: "5 · x − 2 · x − 3 = 6"
            correct: false
            info: "Ohne Klammer wird nur das 2 · $x$ abgezogen. Das Minus muss auch für die 3 gelten."
          - text: "5 · x − y = 2 · x − 3"
            correct: false
            info: "So wird nicht eingesetzt. Du setzt den Term anstelle von $y$ in II ein, die rechte Seite bleibt 6."
        explanation: "Beim Einsetzen immer Klammern um den eingesetzten Term."
        links:
          - title: "Lernlandkarte: Lineare Gleichungssysteme: rechnerisch"
            url: https://lernapps.net/apps/map/mathematik/c/lgs-rechnerisch/
      - type: text
        text: |
          **Das kannst du jetzt:** Du löst ein Gleichungssystem mit dem Einsetzungsverfahren, mit Klammern und Probe. Als Nächstes addierst du die
          Gleichungen.
