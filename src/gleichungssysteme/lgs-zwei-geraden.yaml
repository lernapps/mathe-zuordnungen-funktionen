# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Zwei Tarife, ein Schnittpunkt
description: "Du löst ein Gleichungssystem zeichnerisch: Der Schnittpunkt zweier Geraden ist die Lösung. Du liest ihn ab und prüfst ihn."
competencies: [lineare-gleichungssysteme]
blocks:
  - type: section
    id: einstieg
    title: Welcher Tarif ist besser?
    blocks:
      - type: text
        text: |
          Die Klasse vergleicht zwei Handytarife. **Tarif A:** 6 € Grundpreis und 1 € je Stunde. **Tarif B:** 2 € Grundpreis und 2 € je Stunde.
          Beide sind Geraden. Wo schneiden sie sich? Lies es im Graphen ab.
      - type: vue-component
        id: tarife-graph
        component: Dreifachansicht
        props:
          kind: linear
          xLabel: Zeit (h)
          yLabel: Kosten (€)
          xUnit: h
          yUnit: €
          xs: [0, 1, 2, 3]
          xMin: 0
          xMax: 8
          yMin: 0
          yMax: 16
          tickX: 1
          tickY: 2
          a: 1
          aMin: 1
          aMax: 1
          aStep: 1
          aName: mA
          b: 6
          a2: 2
          b2: 2
          lineName: Tarif A
          line2Name: Tarif B
          fixed: true
        nojs: |
          Tarif A: y = 1 · x + 6, Tarif B: y = 2 · x + 2. Die Tabelle: nach 0, 1, 2, 3 Stunden kostet A 6 €, 7 €, 8 €, 9 € und B 2 €, 4 €, 6 €, 8 €.
          Der Graph von A ist die flachere Gerade (durchgezogen), der von B die steilere (gestrichelt). Sie schneiden sich bei 4 Stunden und 10 €.
      - type: number
        id: gleich-teuer
        text: "Lies im Graphen ab: Nach wie vielen Stunden kosten beide Tarife gleich viel?"
        answer: 4
        tolerance: 0
        unit: Stunden
        mistakes:
          - answer: 10
            message: "10 ist der Preis am Schnittpunkt (y-Achse). Gefragt ist die Zeit auf der x-Achse."
        explanation: "Die Geraden schneiden sich bei x = 4. Dort kosten beide 10 €."
        links:
          - title: "Lernlandkarte: Lineare Gleichungssysteme: grafisch"
            url: https://lernapps.net/apps/map/mathematik/c/lineare-gleichungssysteme/
  - type: section
    id: erklaerung
    title: Die Lösung ist der Schnittpunkt
    blocks:
      - type: definition
        term: Gleichungssystem
        explanation: "Ein lineares Gleichungssystem besteht aus zwei Gleichungen mit zwei Unbekannten x und y. Die Lösung ist ein Zahlenpaar (x|y), das beide Gleichungen erfüllt. Beispiel: y = x + 6 und y = 2 · x + 2 haben die Lösung (4|10)."
      - type: text
        text: |
          Zeichne beide Geraden und lies den **Schnittpunkt** ab. Seine Koordinaten sind die Lösung. Mit einer Tabelle kannst du die Stelle
          eingrenzen: Wo wechselt das Vorzeichen des Unterschieds von A und B? Mache zum Schluss die Probe in beiden Gleichungen.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Die Lösung besteht aus **zwei** Zahlen: x und y. Nur der x-Wert reicht nicht. In der Aufgabe heißt das: nach 4 Stunden und für 10 €.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: In der Tabelle eingrenzen
        blocks:
          - type: table
            caption: Kosten beider Tarife
            rowHeaders: true
            rows:
              - ["Zeit in h", "2", "3", "4", "5"]
              - ["Tarif A in €", "8", "9", "10", "11"]
              - ["Tarif B in €", "6", "8", "10", "12"]
          - type: text
            text: "Bei 3 h ist A teurer (9 € gegen 8 €), bei 5 h ist B teurer (12 € gegen 11 €). Dazwischen wechselt es: bei 4 h sind beide gleich, 10 €. Probe: $4 + 6 = 10$ und $2 \\cdot 4 + 2 = 10$."
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: y-am-schnittpunkt
        given:
          e: { pick: 1, from: { data: schnittpunkte } }
        task:
          text: "Die Geraden y = {{e.m1}} · x + {{e.b1}} und y = {{e.m2}} · x + {{e.b2}} schneiden sich bei x = {{e.x}}. Welchen y-Wert hat der Schnittpunkt?"
        answer: { value: "e.y", compare: { number: { format: integer } } }
        mistakes:
          - value: "e.x"
            message: "{{e.x}} ist der x-Wert. Setze ihn in eine der beiden Gleichungen ein, um y zu bekommen."
          - value: "e.m2 * e.x"
            message: "Du hast die Zahl b der zweiten Gleichung vergessen. y = {{e.m2}} · x + {{e.b2}}, also bleibt + {{e.b2}} stehen."
        hint: "Setze x in eine Gleichung ein und rechne y aus."
        steps:
          - "y = {{e.m1}} · {{e.x}} + {{e.b1}}"
          - "y = {{answer}}. Probe mit der anderen Gleichung: {{e.m2}} · {{e.x}} + {{e.b2}} = {{answer}}."
      - type: single-choice
        id: loesung-paar
        text: "Welches Zahlenpaar (x|y) löst das System y = x + 6 und y = 2 · x + 2?"
        options:
          - text: "(4|10)"
            correct: true
            info: "4 + 6 = 10 und 2 · 4 + 2 = 10: beide Gleichungen stimmen."
          - text: "(10|4)"
            correct: false
            info: "x und y sind vertauscht. Erst kommt x, dann y: 10 + 6 ist nicht 4."
          - text: "(4|8)"
            correct: false
            info: "Bei der zweiten Gleichung passt es (2 · 4 + 2 ist 10, nicht 8). Beide Gleichungen müssen stimmen."
        explanation: "Eine Lösung muss beide Gleichungen erfüllen."
        links:
          - title: "Lernlandkarte: Lineare Gleichungssysteme: grafisch"
            url: https://lernapps.net/apps/map/mathematik/c/lineare-gleichungssysteme/
      - type: true-false
        id: nur-x-wert
        text: "Zur Lösung eines Gleichungssystems mit zwei Gleichungen reicht der x-Wert des Schnittpunkts."
        answer: false
        explanation: "Die Lösung ist ein Paar (x|y). Im Beispiel (4|10): nach 4 Stunden und für 10 €."
        links:
          - title: "Lernlandkarte: Lineare Gleichungssysteme: grafisch"
            url: https://lernapps.net/apps/map/mathematik/c/lineare-gleichungssysteme/
      - type: single-choice
        id: wann-b-teurer
        text: "Tarif A: y = x + 6, Tarif B: y = 2 · x + 2. Ab wie vielen Stunden ist B teurer als A?"
        options:
          - text: "ab mehr als 4 Stunden"
            correct: true
            info: "Rechts vom Schnittpunkt liegt die steilere Gerade B oben, also kostet B dort mehr."
          - text: "bis zu 4 Stunden"
            correct: false
            info: "Links vom Schnittpunkt liegt A oben. Dort ist A teurer, B ist billiger."
          - text: "immer"
            correct: false
            info: "Bei 0 Stunden kostet B 2 €, A 6 €. B ist am Anfang billiger."
        explanation: "Bei 4 Stunden sind beide gleich. Danach ist B teurer, weil B steiler steigt."
        links:
          - title: "Lernlandkarte: Lineare Gleichungssysteme: grafisch"
            url: https://lernapps.net/apps/map/mathematik/c/lineare-gleichungssysteme/
      - type: text
        text: |
          **Das kannst du jetzt:** Du löst ein Gleichungssystem zeichnerisch: Schnittpunkt ablesen, Lösung als Paar (x|y) angeben und prüfen.
          Als Nächstes fragst du, wie viele Lösungen es geben kann.
