# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: "Das Koordinatensystem aus der Grundschule und Klasse 5-6: Achsen, Koordinaten, Punkte ablesen und eintragen."
recap: [mathematik/koordinatensystem]
blocks:
  - type: section
    id: einstieg
    title: Das brauchst du für dieses Kapitel
    blocks:
      - type: text
        text: |
          Die Klasse vergleicht Tarife für die Klassenfahrt. Dafür zeichnest du bald Graphen. Dazu musst du Punkte im
          Koordinatensystem ablesen und eintragen können. Hier ein kurzer Test dazu.
  - type: section
    id: koordinatensystem
    title: Koordinatensystem
    blocks:
      - type: text
        text: |
          Ich kann Punkte und Figuren im Koordinatensystem eintragen und ablesen.
      - type: definition
        term: Koordinaten
        explanation: "Die Koordinaten eines Punktes sind zwei Zahlen. Die erste sagt, wie weit der Punkt nach rechts liegt ($x$-Wert), die zweite, wie weit nach oben ($y$-Wert). Beispiel: Der Punkt (3|2) liegt 3 nach rechts und 2 nach oben."
      - type: definition
        term: Achse
        explanation: "Die $x$-Achse läuft waagerecht, die $y$-Achse senkrecht. Sie schneiden sich im Ursprung (0|0). Auf jeder Achse stehen Zahlen in gleichen Abständen."
      - type: vue-component
        id: test-punkt
        component: Kurztest
        props:
          question: "Welcher Punkt liegt von (2|1) aus 5 nach rechts und 3 nach oben?"
          options:
            - {
                text: "(4|7)",
                correct: false,
                info: "Du hast die Reihenfolge vertauscht. Erst kommt der x-Wert (nach rechts): 2 + 5 = 7, dann der y-Wert (nach oben): 1 + 3 = 4.",
              }
            - {
                text: "(5|3)",
                correct: false,
                info: "Du hast nur die Schritte genommen und sie nicht zum Startpunkt (2|1) addiert. Der Startpunkt zählt mit.",
              }
            - { text: "(7|4)", correct: true, info: "x-Wert: 2 + 5 = 7 (nach rechts). y-Wert: 1 + 3 = 4 (nach oben)." }
          right: "Richtig."
          wrong: "Nicht richtig."
        nojs: |
          Kurztest: Welcher Punkt liegt von (2|1) aus 5 nach rechts und 3 nach oben? Antwort: (7|4), denn 2 + 5 = 7 für den x-Wert und 1 + 3 = 4 für den y-Wert.
      - type: vue-component
        id: test-ursprung
        component: Kurztest
        props:
          question: "Der Punkt P hat die Koordinaten (0|5). Wo liegt P?"
          options:
            - {
                text: "auf der x-Achse, 5 rechts vom Ursprung",
                correct: false,
                info: "Du hast x und y vertauscht. Der erste Wert ist der x-Wert: 0 heißt, P liegt weder rechts noch links vom Ursprung.",
              }
            - {
                text: "5 nach rechts und 5 nach oben",
                correct: false,
                info: "Der x-Wert ist 0, also geht es nicht nach rechts. Nur der y-Wert ist 5.",
              }
            - {
                text: "auf der y-Achse, 5 über dem Ursprung",
                correct: true,
                info: "x = 0 heißt: P liegt auf der y-Achse. y = 5 heißt: 5 Einheiten über dem Ursprung (0|0).",
              }
          right: "Richtig."
          wrong: "Nicht richtig."
        nojs: |
          Kurztest: Der Punkt P hat die Koordinaten (0|5). Wo liegt P? Antwort: auf der y-Achse, 5 Einheiten über dem Ursprung (0|0).
      - type: text
        text: "Wenn das nicht klappt: Wiederhole den Baustein „Koordinatensystem“ auf der Lernlandkarte: [Kartenseite](https://lernapps.net/apps/map/mathematik/c/koordinatensystem/)."
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - die Koordinaten eines Punktes angeben kannst (erst $x$, dann $y$),
          - weißt, was die Achsen und der Ursprung sind.
